pcm.pisound {
    type hw
    card pisound
}

ctl.pisound {
    type hw
    card pisound
}

pcm.!default {
    type plug
    slave.pcm "pisound"
}

pcm.dspprocess {
    type plug
    slave.pcm {
        type pipe
        format raw
        slave.pcm "pisound"
    }
    route_policy "default"
}

ctl.!default {
    type hw
    card pisound
}